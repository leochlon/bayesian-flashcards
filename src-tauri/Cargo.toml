[package]
name = "bayes-flashcards"
version = "0.1.0"
description = "Bayesian Adaptive SRS Flashcard System"
authors = ["you"]
license = ""
repository = ""
default-run = "bayes-flashcards"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = [] }
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-http = "2.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
tempfile = "3.0"
zip = "0.6"
which = "4.0"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[[bin]]
name = "bayes-flashcards"
path = "src/main.rs"
