[package]
name = "bayes-flashcards"
version = "0.1.0"
description = "Bayesian Adaptive SRS Flashcard System"
authors = ["Leon Chlon"]
license = "MIT"
repository = "https://github.com/yourusername/bayesFlashcards"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.0", features = [] }

[dependencies]
tauri = { version = "1.0", features = [ "window-hide", "shell-execute", "window-minimize", "process-exit", "window-start-dragging", "protocol-all", "window-close", "window-show", "shell-sidecar", "window-unmaximize", "window-maximize", "window-unminimize", "process-relaunch", "shell-open", "fs-all", "dialog-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
which = "4.0"
tempfile = "3.0"
zip = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "1.0", features = ["api-all", "shell-open", "window-all", "fs-all", "dialog-all", "process-all"] }
